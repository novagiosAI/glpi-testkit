[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glpi-testkit"
version = "0.1.0"
description = "Generate synthetic ITIL-compliant GLPI tickets in French, Arabic and Darija — training and test data with no client data involved"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Novagios", email = "contact@novagios.com" }]
keywords = ["glpi", "itil", "itsm", "synthetic-data", "test-data", "arabic", "darija", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Arabic",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.5"]
glpi = ["glpi-rest>=0.1"]

[project.scripts]
glpi-testkit = "glpi_testkit.cli:main"

[project.urls]
Homepage = "https://github.com/novagiosAI/glpi-testkit"
Repository = "https://github.com/novagiosAI/glpi-testkit"
Issues = "https://github.com/novagiosAI/glpi-testkit/issues"
Changelog = "https://github.com/novagiosAI/glpi-testkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/glpi_testkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/glpi_testkit"]
